<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">
    <table width="100%" cellspacing="0" cellpadding="0" style="background-color: #f4f4f4; padding: 40px 0;">
        <tr>
            <td align="center">
                <table width="600" cellspacing="0" cellpadding="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                    <tr>
                        <td style="padding: 40px 30px; text-align: center;">
                            <h2 style="color: #333;">Reset Your Password</h2>
                            <p style="color: #666; font-size: 16px;">We received a request to reset your password. Use the 6-digit verification code below to continue:</p>

                            <div style="margin-top: 20px; font-size: 28px; font-weight: bold; color: #007BFF; padding: 16px 32px; display: inline-block; border-radius: 6px;">
                                {{resetCode}}
                            </div>

                            <p style="color: #999; font-size: 14px; margin-top: 30px;">If you didn’t request this, you can safely ignore this email.</p>
                            <p style="color: #999; font-size: 13px;">This code will expire in 1 hour.</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: center; padding: 20px; background-color: #f9f9f9; color: #aaa; font-size: 12px;">
                            &copy; 2025 MedLink. All rights reserved.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
