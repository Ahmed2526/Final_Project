<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Appointment Confirmation</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">
    <table width="100%" cellspacing="0" cellpadding="0" style="background-color: #f4f4f4; padding: 40px 0;">
        <tr>
            <td align="center">
                <table width="600" cellspacing="0" cellpadding="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                    <tr>
                        <td style="padding: 40px 30px; text-align: center;">
                            <h2 style="color: #28a745;">Appointment Confirmed</h2>
                            <p style="color: #666; font-size: 16px;">
                                Hello <strong>{{UserName}}</strong>, your appointment has been successfully booked.
                            </p>

                            <p style="color: #333; font-size: 16px; margin: 30px 0;">
                                <strong>Date:</strong> {{AppointmentDay}}<br />
                                <strong>Time:</strong> {{AppointmentTime}}<br />
                                <strong>Location:</strong> {{ClinicLocation}}
                            </p>

                            <p style="color: #999; font-size: 14px; margin-top: 30px;">
                                Please arrive 10 minutes early. Thank you for choosing us!
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: center; padding: 20px; background-color: #f9f9f9; color: #aaa; font-size: 12px;">
                            &copy; 2025 MedLink. All rights reserved.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
